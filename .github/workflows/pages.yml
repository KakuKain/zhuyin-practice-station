name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - uses: actions/configure-pages@v5
        id: pages
      - run: npm run build:pages
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:4185${{ steps.pages.outputs.base_path }}/
          PLAYWRIGHT_WEB_SERVER_COMMAND: npm run preview:pages -- --host 127.0.0.1 --port 4185 --strictPort
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: pages-browser-test-failures
          path: |
            playwright-report
            test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
